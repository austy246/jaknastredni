[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaknastredni"
version = "0.1.0"
description = "Sběr a porovnání dat o středních školách v Praze"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# budoucí importér ČŠI PDF
csi = ["pymupdf>=1.24"]

[project.scripts]
jns-msmt = "jaknastredni.msmt:main"
jns-cermat-mz = "jaknastredni.cermat_mz:main"
jns-csi = "jaknastredni.csi:main"

[tool.setuptools.packages.find]
include = ["jaknastredni*"]

[tool.setuptools.package-data]
jaknastredni = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
