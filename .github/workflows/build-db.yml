# Sestaví databázi `data/jaknastredni.db` čistě z `data/raw/` (bez sítě, viz
# jaknastredni/build_db.py a README.md, sekce "Rychlý start"), vyexportuje
# z ní data pro webového průvodce a nasadí ho na GitHub Pages.
#
# Ani databáze, ani `web/data.js` se neverzují — obojí jsou odvozené
# artefakty (README, "Rozhodnutí o vývoji a ukládání dat"), takže se při
# každém nasazení staví znovu. Po `git clone` je v repu jen `web/index.html`
# a bez `export_web` je stránka prázdná; tenhle workflow je to jediné místo,
# kde se obojí spojí dohromady.
#
# POZOR: Pages se musí **jednou ručně zapnout** v Settings → Pages →
# Source: "GitHub Actions". `enablement: true` na to nestačí — `GITHUB_TOKEN`
# nemá právo web Pages založit (API vrátí "Resource not accessible by
# integration"), oprávnění `pages: write` stačí jen na nasazení do už
# existujícího webu. Dokud Pages zapnuté nejsou, workflow **nespadne**:
# sestaví databázi, nahraje ji jako artefakt a nasazení jen přeskočí.
name: Build database and deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "jaknastredni/**"
      - "web/**"
      - ".github/workflows/build-db.yml"
  workflow_dispatch: {}

# Potřeba pro nasazení na Pages přes OIDC (actions/deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# Souběžná nasazení by si přepisovala výsledek; rozdělaný běh se ale
# nepřerušuje, ať se nezveřejní napůl sestavená stránka.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build database (offline, jen z data/raw/)
        run: python -m jaknastredni.build_db --db data/jaknastredni.db -v

      - name: Export dat pro web
        run: python -m jaknastredni.export_web --db data/jaknastredni.db -o web/data.js -v

      - uses: actions/upload-artifact@v4
        with:
          name: jaknastredni-db
          path: data/jaknastredni.db
          retention-days: 30

      # Když Pages nejsou zapnuté, tenhle krok selže — ale build databáze
      # kvůli tomu nemá být červený, ta na Pages nezávisí.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::Pages nejsou zapnuté, nasazení přeskočeno." \
               "Zapni je v Settings → Pages → Source: GitHub Actions a spusť workflow znovu."

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
