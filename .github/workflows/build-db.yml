# Sestaví databázi jaknastredni.db čistě z data/raw/ (bez sítě, viz
# jaknastredni/build_db.py a README.md, sekce "Rychlý start"). Databáze se
# neverzuje v repu, proto ji tenhle workflow sestavuje znovu při každém
# nasazení a nahrává jako artefakt.
#
# Skutečné nasazení (zkopírování artefaktu na server / do běžící aplikace)
# zatím neexistuje — projekt zatím nemá vlastní aplikaci, jen sběr dat. Až
# vznikne, přidá se sem krok, který výsledný soubor doručí tam, kde ho
# aplikace čte.
name: Build database

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "jaknastredni/**"
      - ".github/workflows/build-db.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Build database (offline, jen z data/raw/)
        run: python -m jaknastredni.build_db --db data/jaknastredni.db -v

      - uses: actions/upload-artifact@v4
        with:
          name: jaknastredni-db
          path: data/jaknastredni.db
          retention-days: 30
